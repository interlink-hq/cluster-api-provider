---
# Pilot-mode example: on-demand interLink plugin instantiation using the
# Apptainer plugin (https://github.com/interlink-hq/interlink-apptainer-plugin).
#
# In this mode the controller creates a Pod (and a ClusterIP Service) that runs
# the interLink apptainer plugin on an *existing* virtual node that has access to
# the remote resource provider (e.g. an HPC cluster running Apptainer).
# The Service address is automatically used as the interLinkAddress for the
# VirtualNode, so no external interLink deployment is required beforehand.
#
# Flow:
#   cluster-api  →  InterlinkMachine created
#                →  controller creates Plugin Pod on existing virtual node
#                →  controller creates ClusterIP Service for the Pod
#                →  Pod becomes Running → interLinkAddress derived from Service
#                →  VirtualNode created pointing at the Service
#                →  node is Ready with the requested capacity
#
# The same InterlinkMachineTemplate can be referenced by a MachineDeployment
# and scaled by the Cluster Autoscaler.

# -- Apptainer plugin configuration ------------------------------------------
# The apptainer plugin reads its configuration from a YAML file.
# Mount this ConfigMap into the plugin Pod as /etc/interlink/ApptainerConfig.yaml.
# Adjust the values below to match your environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: apptainer-plugin-config
  namespace: default
data:
  ApptainerConfig.yaml: |
    SidecarPort: "4000"
    DataRootFolder: "/tmp/.interlink/"
    ApptainerPath: "/usr/bin/apptainer"
    ApptainerDefaultOptions:
      - "--no-eval"
      - "--containall"
    ImagePrefix: "docker://"
    BashPath: /bin/bash
    ExportPodData: true
    VerboseLogging: false
    ErrorsOnlyLogging: false
    EnableProbes: false
---
# -- Cluster -----------------------------------------------------------------
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: pilot-cluster
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - "192.168.0.0/16"
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: InterlinkCluster
    name: pilot-cluster
    namespace: default
  controlPlaneEndpoint:
    # Replace with the address of your management Kubernetes API server.
    host: "10.0.0.1"
    port: 6443
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: InterlinkCluster
metadata:
  name: pilot-cluster
  namespace: default
spec:
  controlPlaneEndpoint:
    # Replace with the address of your management Kubernetes API server.
    host: "10.0.0.1"
    port: 6443
---
# -- MachineDeployment (autoscalable) ----------------------------------------
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: pilot-workers
  namespace: default
spec:
  clusterName: pilot-cluster
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: pilot-cluster
  template:
    spec:
      clusterName: pilot-cluster
      bootstrap:
        dataSecretName: null  # virtual nodes do not need a bootstrap secret
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: InterlinkMachineTemplate
        name: pilot-machine-template
        namespace: default
---
# -- InterlinkMachineTemplate (pilot mode) ------------------------------------
#
# The PluginSpec instructs the controller to:
#   1. Create a Pod named "<machine-name>-plugin" scheduled on the existing
#      virtual node identified by the nodeSelector / tolerations.
#   2. Create a ClusterIP Service named "<machine-name>-plugin" that exposes
#      the Pod on the given port.
#   3. Use "http://<svc>.<namespace>.svc.cluster.local:<port>" as the
#      interLinkAddress for the VirtualNode.
#
# InterLinkAddress is intentionally omitted here; it is derived automatically.
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: InterlinkMachineTemplate
metadata:
  name: pilot-machine-template
  namespace: default
spec:
  template:
    spec:
      # Virtual node capacity advertised to the Kubernetes scheduler.
      resources:
        cpu: "8"
        memory: "32Gi"
        pods: "110"
      labels:
        node.kubernetes.io/type: virtual
        interlink.eu/provider: hpc-apptainer
      taints:
        - key: virtual-node.interlink.eu
          effect: NoSchedule
      # Pilot-mode configuration.
      pluginSpec:
        # Apptainer plugin image from https://github.com/interlink-hq/interlink-apptainer-plugin.
        # Build the image from source and push it to a registry accessible from the cluster,
        # or use a pre-built image if one is available.
        image: "ghcr.io/interlink-hq/interlink-apptainer-plugin:latest"
        # TCP port the plugin listens on inside the container (default: 4000).
        port: 4000
        # Schedule the plugin Pod onto an existing virtual node backed by the
        # HPC cluster.  Adjust the selector to match your virtual node labels.
        nodeSelector:
          interlink.eu/provider: hpc-cluster
        # Tolerate the taint that is typically applied to interLink virtual nodes.
        tolerations:
          - key: virtual-node.interlink.eu
            operator: Exists
            effect: NoSchedule
        # Environment variables for the apptainer plugin.
        # APPTAINERCONFIGPATH tells the plugin where to find its config file.
        # SHARED_FS=true enables shared-filesystem mode (set by the container entrypoint).
        env:
          - name: APPTAINERCONFIGPATH
            value: "/etc/interlink/ApptainerConfig.yaml"
        # Mount the ConfigMap defined above so the plugin can read its configuration.
        volumes:
          - name: plugin-config
            configMap:
              name: apptainer-plugin-config
        volumeMounts:
          - name: plugin-config
            mountPath: /etc/interlink
            readOnly: true
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
